<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Checker</title>
  </head>
  <body>
    <div class="container">
      <h1>How are you feeling today?</h1>
      <div class="happy">
        <div class="happy-emoji">😄</div>
        Happy
      </div>
      <div class="tired">
        <div class="tired-emoji">😴</div>
        Tired
      </div>
      <div class="sad">
        <div class="sad-emoji">☹️</div>
        Sad
      </div>

      <button>Select your mood</button>
    </div>
  </body>
</html>
